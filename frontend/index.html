<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>플리마켓 - 지금 열리고 있는 마켓</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="common/css/style.css" />
  <link rel="stylesheet" href="pages/A_auth-main/css/main.css?v=11" />
  <link rel="stylesheet" href="/common/css/search.css" />
  <!-- [C-01/C-02] 역할별 화면 분기 · 주최자 역할 전환 버튼 -->
  <script src="common/js/role-routing.js?v=3"></script>
  <!-- [공통] 상단 고정 네비게이션 바 (모든 화면 공통) -->
  <link rel="stylesheet" href="common/css/global-nav.css?v=5" />
  <script src="common/js/global-nav.js?v=6" defer></script>
</head>
<body>
  <div class="board">
    <header class="nav">
      <div class="brand"><span class="pin-dot" aria-hidden="true"></span>플리마켓</div>
      <nav class="nav-links">
        <a href="pages/A_auth-main/login.html" id="nav-login-link" class="link-ghost">로그인</a>
        <a href="pages/A_auth-main/register.html" id="nav-register-link" class="link-ghost">회원가입</a>
        <a href="pages/A_auth-main/mypage.html" id="nav-mypage-link" class="link-ghost" hidden>마이페이지</a>
        <button type="button" id="nav-logout-btn" class="btn-logout" hidden>로그아웃</button>
        <button id="host-cta" class="btn btn-mustard" hidden>마켓 등록하기</button>
        <button id="nav-hostmarket-link" class="btn btn-mustard" hidden>내 마켓 관리</button>
        <button id="nav-sellerbooth-link" class="btn btn-mustard" hidden>내 부스 관리</button>
      </nav>
    </header>

    <section class="board-head">
      <h1>지금 열리고 있는<br />플리마켓 ✨</h1>
      <p class="sub">로그인 없이도 동네 곳곳의 벼룩시장을 먼저 둘러볼 수 있어요.</p>

      <div class="filter-strip">
        <label class="filter-field">
          지역
          <select id="region-filter">
            <option value="">전체</option>
          </select>
        </label>
        <label class="filter-field">
          정렬
          <select id="sort-filter">
            <option value="deadline">마감임박순</option>
            <option value="latest">최신등록순</option>
            <option value="priceLow">낮은가격순</option>
          </select>
        </label>
        <span id="result-count" class="result-count"></span>
      </div>

      <div class="status-tabs" role="tablist">
        <button type="button" class="status-tab" id="tab-ongoing" data-tab="ongoing" role="tab" aria-selected="false"><span class="dot"></span>진행 중인 행사</button>
        <button type="button" class="status-tab is-active" id="tab-recruiting" data-tab="recruiting" role="tab" aria-selected="true"><span class="dot"></span>모집 중인 행사</button>
        <button type="button" class="status-tab" id="tab-upcoming" data-tab="upcoming" role="tab" aria-selected="false"><span class="dot"></span>진행 예정 행사</button>
        <button type="button" class="status-tab" id="tab-ended" data-tab="ended" role="tab" aria-selected="false"><span class="dot"></span>종료된 행사</button>
      </div>
    </section>

    <section class="region-explorer" aria-label="지역별 플리마켓 현황">
      <aside class="region-panel">
        <h2 class="region-panel-title">전국 한눈에 보기</h2>
        <p class="region-panel-sub">지역을 클릭하면 해당 지역의 행사를 확인할 수 있어요.</p>
        <div id="kr-region-list-host"></div>
        <div class="region-total-box">
          <span class="region-total-label">등록된 전국 행사</span>
          <span class="region-total-value"><strong id="kr-total-count">0</strong>개</span>
        </div>
      </aside>

      <div class="region-map-wrap">
        <h2 class="region-map-title">지역별 플리마켓 현황</h2>
        <p class="region-map-sub">원하는 지역을 클릭해보세요!</p>
        <div id="kr-map" class="kr-map"></div>
      </div>

      <div class="region-events">
        <section id="market-grid" class="market-grid" aria-live="polite"></section>
        <p id="empty-state" class="empty-state" hidden>조건에 맞는 열려 있는 마켓이 없어요. 다른 지역을 선택해 보세요.</p>
        <nav id="pagination" class="pagination" aria-label="마켓 목록 페이지"></nav>
      </div>
    </section>
  </div>

  <script src="common/js/api.js?v=4"></script>
  <script src="common/js/profile-link.js?v=1"></script>
  <script src="pages/A_auth-main/js/kr-map-data.js?v=1"></script>
  <script src="pages/A_auth-main/js/region-map.js?v=3"></script>
  <script src="pages/A_auth-main/js/main.js?v=10"></script>
  <script src="/common/js/search.js?v=3"></script>
</body>
</html>
