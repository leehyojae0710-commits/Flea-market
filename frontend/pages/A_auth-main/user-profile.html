<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>프로필 - 플리마켓</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../../common/css/style.css" />
    <link rel="stylesheet" href="../B_host-seller/css/host-seller.css?v=2" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/profile.css?v=5" />
    <script src="../../common/js/role-routing.js?v=3"></script>
    <!-- [공통] 상단 고정 네비게이션 바 (모든 화면 공통) -->
    <link rel="stylesheet" href="../../common/css/global-nav.css?v=1" />
    <script src="../../common/js/global-nav.js?v=1" defer></script>
</head>

<body class="profile-body">
    <div class="page-wrap">
        <header class="nav">
            <a href="../../index.html" class="brand"><span class="pin-dot" aria-hidden="true"></span>플리마켓</a>
        </header>

        <div class="panel">
            <span class="pin" aria-hidden="true"></span>

            <div id="alert-box" class="alert alert-error" role="alert"></div>

            <div class="profile-top">
                <div id="profile-avatar" class="profile-avatar">프로필<br />사진란</div>
                <div class="profile-top-info">
                    <span id="profile-role-chip" class="profile-role-chip" hidden>주최자 프로필</span>
                    <div id="profile-title-badge" class="profile-title-badge">불러오는 중...</div>
                    <p id="profile-intro" class="profile-intro"></p>
                </div>
            </div>

            <hr class="section-divider" />

            <div class="profile-section">
                <div class="profile-section-label">소개글</div>
                <div class="profile-bio-row">
                    <p id="profile-bio-text" class="profile-bio-text">등록된 소개글이 없어요.</p>
                    <div id="profile-bio-image" class="profile-bio-image">소개 이미지</div>
                </div>
            </div>

            <!-- [추가] 주최자 프로필: 주최행사 성공율 -->
            <!-- 판매자가 이 주최자를 믿고 신청할지 판단하는 핵심 지표라 공개 프로필에도 넣습니다. -->
            <div class="profile-section" id="host-success-block" hidden>
                <div class="success-rate-card">
                    <div class="success-rate-info">
                        <div class="success-rate-title">주최행사 성공율</div>
                        <p class="success-rate-desc">종료된 행사 기준</p>
                        <ul class="success-rate-legend">
                            <li><i class="lg lg-ok"></i>정상 개최 <b id="rate-success">-</b></li>
                            <li><i class="lg lg-cancel"></i>취소 <b id="rate-cancelled">-</b></li>
                        </ul>
                        <p class="success-rate-note" id="rate-pending"></p>
                    </div>
                    <div class="success-rate-donut" id="stat-donut" role="img"
                        aria-label="주최행사 성공율">
                        <span class="success-rate-center" id="stat-donut-rate">-</span>
                    </div>
                </div>
            </div>

            <!-- 주최자 프로필: 행사 현황 -->
            <div class="profile-section" id="host-stats-block" hidden>
                <div class="profile-section-label">행사 현황</div>
                <div class="profile-stats-row">
                    <div class="profile-stat">
                        <span id="stat-upcoming" class="profile-stat-num">-</span>
                        <span class="profile-stat-label">진행 중 / 예정</span>
                    </div>
                    <div class="profile-stat">
                        <span id="stat-past" class="profile-stat-num">-</span>
                        <span class="profile-stat-label">지난 행사</span>
                    </div>
                    <div class="profile-stat">
                        <span id="stat-cancelled" class="profile-stat-num">-</span>
                        <span class="profile-stat-label">취소 이력</span>
                    </div>
                </div>
            </div>

            <!-- 판매자 프로필: 참여 이력 -->
            <div class="profile-section" id="seller-stats-block" hidden>
                <div class="profile-section-label">참여 이력</div>
                <div class="profile-stats-row">
                    <div class="profile-stat">
                        <span id="stat-participated" class="profile-stat-num">-</span>
                        <span class="profile-stat-label">참여 마켓</span>
                    </div>
                    <div class="profile-stat">
                        <span id="stat-review-count" class="profile-stat-num">-</span>
                        <span class="profile-stat-label">받은 후기</span>
                    </div>
                </div>
            </div>

            <!-- 공통: 평가 요약 + 목록 -->
            <div class="profile-section" id="review-section" hidden>
                <div class="profile-section-label" id="review-section-label">평가</div>
                <div class="review-summary-card">
                    <span class="review-summary-score" id="review-avg-score">-</span>
                    <div class="review-summary-meta">
                        <span class="review-summary-stars" id="review-avg-stars">☆☆☆☆☆</span>
                        <span class="review-summary-count" id="review-count-text"></span>
                    </div>
                </div>
                <ul class="review-list" id="review-list"></ul>
            </div>
        </div>

        <a href="../../index.html" class="back-link">← 마켓 목록으로</a>
    </div>

    <script src="../../common/js/api.js?v=4"></script>
    <script src="js/user-profile.js?v=3"></script>
</body>

</html>
