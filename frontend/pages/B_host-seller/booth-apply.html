<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>부스 신청 - 플리마켓</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../common/css/style.css" />
  <link rel="stylesheet" href="css/host-seller.css?v=3" />
  <!-- [공통] 상단 고정 네비게이션 바 (모든 화면 공통) -->
  <link rel="stylesheet" href="../../common/css/global-nav.css?v=3" />
  <script src="../../common/js/global-nav.js?v=4" defer></script>
</head>
<body>
  <div class="page-wrap">
    <header class="nav">
      <a href="../../index.html" class="brand"><span class="pin-dot" aria-hidden="true"></span>플리마켓</a>
      <a href="../A_auth-main/mypage.html" class="link-ghost">마이페이지</a>
    </header>

    <div class="panel">
      <span class="pin" aria-hidden="true"></span>
      <h1>부스 신청</h1>
      <p class="panel-sub" id="booth-apply-sub">신청할 부스 번호와 판매하실 물건을 알려주세요.</p>
      <!-- [추가] 신청하려는 마켓의 주최자 (클릭하면 프로필로 이동) -->
      <p class="panel-sub" id="booth-apply-host" style="display:none;"></p>

      <div id="alert-box" class="alert alert-error" role="alert"></div>
      <!-- [추가] 겹치는 날짜의 다른 마켓 신청 안내 - 신청을 막지는 않고 알려주기만 함 -->
      <div id="date-overlap-notice" class="alert alert-warning" role="status"></div>
      <!-- [추가] 같은 마켓에 이미 신청한 건이 있을 때 안내 - 신청을 막지는 않음 -->
      <div id="duplicate-notice" class="alert alert-warning" role="status"></div>

      <form id="booth-apply-form" novalidate>
        <input type="hidden" id="market-id" />

                <!-- [부스 종류] 주최자가 A/B/C 로 나눠 올린 경우에만 보입니다. -->
        <div class="form-field" id="booth-type-field" hidden>
          <label for="booth-type">부스 종류 *</label>
          <select id="booth-type" class="form-input"></select>
          <p class="form-hint" id="booth-type-hint">종류에 따라 부스료가 달라요. 승인되면 선택한 종류의 금액으로 결제하게 됩니다.</p>
        </div>

<div class="form-field">
          <label for="booth-number">부스 번호</label>
          <input type="text" id="booth-number" class="form-input" placeholder="예: 1, A1" maxlength="10" required />
          <p class="form-hint">최대 10자까지 입력할 수 있어요.</p>
        </div>

        <div class="form-field">
          <label for="booth-title">부스 이름</label>
          <input type="text" id="booth-title" class="form-input" placeholder="예: 민지네 빈티지샵" maxlength="100" required />
          <p class="form-hint">최대 100자까지 입력할 수 있어요.</p>
        </div>

        <div class="form-field">
          <label for="item-name">판매 물품 이름</label>
          <input type="text" id="item-name" class="form-input" placeholder="예: 빈티지 자켓 모음" maxlength="100" required />
          <p class="form-hint">최대 100자까지 입력할 수 있어요.</p>
        </div>

        <div class="form-field">
          <label for="product-image">대표 이미지</label>
          <input type="file" id="product-image" class="form-input" accept="image/*" />
          <p class="form-hint">jpg, jpeg, png 파일만 업로드할 수 있어요.</p>
          <img id="product-image-preview" alt="" style="display:none;max-width:100%;border-radius:8px;margin-top:10px;" />
          <input type="hidden" id="uploaded-item-image-path" />
        </div>

        <div class="form-field">
          <label for="product-desc">판매 물품 소개</label>
          <textarea id="product-desc" class="form-textarea" placeholder="어떤 물건을 판매하실 건지 자유롭게 소개해주세요." maxlength="1000"></textarea>
          <p class="form-hint">최대 1000자까지 입력할 수 있어요.</p>
        </div>

        <button type="submit" id="booth-apply-submit-btn" class="btn btn-primary btn-block">신청하기</button>
      </form>
    </div>

    <a href="#" id="back-to-market" class="back-link">← 마켓 상세로 돌아가기</a>
  </div>

  <script src="../../common/js/api.js?v=4"></script>
  <script src="../../common/js/booth-types.js?v=2"></script>
  <script src="../../common/js/profile-link.js?v=1"></script>
  <script src="js/market.js?v=17"></script>
</body>
</html>
