<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마켓 등록 - 플리마켓</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../../common/css/style.css" />
  <link rel="stylesheet" href="css/host-seller.css?v=2" />

  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=19f0092b5cdea100b70fdb607cc3ddd0&libraries=services"></script>
  <script type="module" src="js/marketmap.js?v=2"></script>
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script src="js/market.js?v=9"></script>
  <script src="../../common/js/api.js?v=4"></script>
  <script type="module" src="js/marketdate.js?v=2"></script>
  <!-- <script type="module" src="js/map-integration.js?v=2"></script> -->
  <!-- [C-01] 역할별 첫 화면 분기 / 주최자 전용 화면 접근 차단 -->
  <script src="../../common/js/role-routing.js?v=3"></script>
  <!-- [공통] 상단 고정 네비게이션 바 (모든 화면 공통) -->
  <link rel="stylesheet" href="../../common/css/global-nav.css?v=2" />
  <script src="../../common/js/global-nav.js?v=2" defer></script>
</head>

<body>
  <div class="page-wrap">
    <header class="nav">
      <a href="../../index.html" class="brand"><span class="pin-dot" aria-hidden="true"></span>플리마켓</a>
      <a href="../A_auth-main/mypage.html" class="link-ghost">마이페이지</a>
    </header>

    <div class="panel">
      <span class="pin" aria-hidden="true"></span>
      <h1>플리마켓 공고 등록</h1>
      <p class="panel-sub">동네 사람들에게 마켓을 알려보세요.</p>

      <div id="alert-box" class="alert alert-error" role="alert"></div>

      <form id="market-create-form" novalidate>
        <div class="form-field">
          <label for="title">마켓 이름</label>
          <input type="text" id="title" class="form-input" placeholder="예: 연남동 주말 플리마켓" required />
        </div>

        <div class="form-field">
          <label for="event-date">모집 기간 <p>* 정확한 모집 일자를 적어 주세요</p></label>
          <div class="date-row">
            <input type="date" id="recruitmentDate_min" class="form-input date-input" required />
            <span class="date-separator">~</span>
            <input type="date" id="recruitmentDate_max" class="form-input date-input" required />
          </div>
        </div>

        <div class="form-field">
          <label for="event-date">개최 일자 <p>* 정확한 개최 일자를 적어 주세요</p><p>* 모집 기간과 개최 기간 사이에는 최소 일주일의 간격이 있어야 합니다.</p></label>
          <div class="date-row">
            <input type="date" id="start-event-date" class="form-input date-input" required />
            <span class="date-separator">~</span>
            <input type="date" id="end-event-date" class="form-input date-input" required />
          </div>
        </div>

        <div class="form-field">
          <label for="booth-price">부스료 (원)</label>
          <input type="number" id="booth-price" class="form-input" placeholder="0" min="0" max="100000000" required />
          <p class="form-hint">참가비가 없다면 0을 입력해주세요.</p>
          <p class="form-hint">부스료는 최대 1억 원까지 가능합니다.</p>
        </div>

        <div class="form-field">
          <label for="max-participants">허용 가능한 최대 부스 수</label>
          <input type="number" id="max-participants" class="form-input" placeholder="0" min="0" max="10000" required />
          <p class="form-hint">부스 수량에 제한이 없다면 0을 입력해주세요.</p>
          <p class="form-hint">최대 부스 수는 10,000개까지 가능합니다.</p>
        </div>
        <div class="form-field">
          <label for="allow-duplicate-application" style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="allow-duplicate-application" style="width:auto;" checked />
            같은 판매자의 중복 부스 신청 허용하기
          </label>
          <p class="form-hint">꺼두면 한 판매자는 이 마켓에 부스를 하나만 신청할 수 있어요. 같은 상품이든 다른 상품이든 이미 신청(대기/승인/결제완료) 중이면 추가 신청이 막혀요.</p>
        </div>
        <div class="form-field">
          <label for="market-image">마켓 이미지</label>
          <input type="file" id="market-image" name="marketimage" class="form-input" accept="image/*" />
          <p class="form-hint">마켓을 대표하는 이미지를 업로드해주세요.</p>
        </div>
        <!-- <button type="button" id="image-upload-btn" class="form-input" style="margin-bottom: 15px;">사진 등록하기</button> -->
        <div id="image-upload-status"></div>
        <!-- [추가] 고른 이미지를 취소할 수 있는 버튼 -->
        <div class="image-actions">
          <button type="button" id="remove-market-image-btn" class="btn btn-outline btn-sm" hidden>이미지 삭제</button>
        </div>
        <input type="hidden" id="uploadedImagePath" name="uploadedImagePath" />

        <div class="form-field">
          <label for="description">상세 설명</label>
          <textarea id="description" class="form-textarea" placeholder="마켓 소개, 운영 시간, 유의사항 등을 적어주세요."></textarea>
        </div>

        <div class="form-field" id="map-search">
          <label for="postcode">개최 장소 주소</label>
          <div class="form-field">
            <!-- <input type="text" id="address-input" class="form-input" placeholder="주소를 입력하고 검색해주세요" /> -->
            <!-- <form> -->
            <div class="form-field">
              <!-- 우편번호 -->
              <input type="text" class="form-input" id="postcode" placeholder="우편번호" readonly>

              <!-- 기본주소 -->
              <input type="text" class="form-input" id="address" placeholder="주소" readonly>

              <!-- 상세주소 -->
              <input type="text" class="form-input" id="detailAddress" placeholder="상세주소">
              <p class="form-hint" id="button_hint"></p>
              <button type="button" class="form-input" onclick="execDaumPostcode()">우편번호 찾기</button>
              <!-- </form> -->
            </div>
            <!-- <button type="button" id="address-search-btn" class="btn btn-outline">검색</button> -->
          </div>
          <input type="hidden" id="latitude" />
          <input type="hidden" id="longitude" />
          <input type="hidden" id="fullAddress" name="fullAddress" />
          <input type="hidden" id="region" name="region" />
          <!-- <div id="map-container">주소를 검색하면 지도에 위치가 표시됩니다.</div> -->
          <div id="map-container"
            style="width:100%; max-width:800px; height:300px; border:1px solid #ccc; display:flex; align-items:center; justify-content:center; color:#666; font-size:14px;">
            주소를 검색하면 지도에 위치가 표시됩니다.
          </div>
        </div>
        <button type="submit" id="market-create-submit-btn" class="btn btn-primary btn-block">등록하기</button>
      </form>
    </div>

    <a href="../../index.html" class="back-link">← 마켓 목록으로</a>
  </div>

</body>

</html>
