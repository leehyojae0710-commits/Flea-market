<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마켓 상세 - 플리마켓</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../common/css/style.css" />
  <link rel="stylesheet" href="css/host-seller.css?v=3" />
  <!-- [C-01/C-02] 역할별 화면 분기 · 주최자 역할 전환 버튼 -->
  <script src="../../common/js/role-routing.js?v=3"></script>
  <!-- [공통] 상단 고정 네비게이션 바 (모든 화면 공통) -->
  <link rel="stylesheet" href="../../common/css/global-nav.css?v=3" />
  <script src="../../common/js/global-nav.js?v=4" defer></script>
</head>
<body>
  <div class="page-wrap">
    <header class="nav">
      <a href="../../index.html" class="brand"><span class="pin-dot" aria-hidden="true"></span>플리마켓</a>
      <a href="../A_auth-main/mypage.html" class="link-ghost">마이페이지</a>
    </header>

    <div id="alert-box" class="alert alert-error" role="alert"></div>

    <div class="panel">
      <span class="pin" aria-hidden="true"></span>
      <div class="market-title-row">
        <h1 id="market-title">마켓 정보를 불러오는 중...</h1>
        <span id="market-status" class="status-tag" style="display:none;"></span>
      </div>
      <p class="panel-sub" id="market-info"></p>
      <!-- [추가] 주최자 닉네임 (클릭하면 프로필로 이동) -->
      <p class="panel-sub" id="market-host" style="display:none;"></p>
      <p class="panel-sub" id="market-dday" style="display:none;"></p>

      <img id="market-image" class="market-image" alt="마켓 대표 이미지" style="display:none;" />
      <p id="market-description" class="market-description"></p>
      <a id="market-map-link" class="form-hint market-map-link" href="#" target="_blank" rel="noopener" style="display:none;">📍 카카오맵에서 위치 보기</a>

      <div id="booth-select-panel">
        <h2>부스 신청</h2>
        <p class="form-hint" id="booth-select-hint" style="margin-bottom:12px;">참가하고 싶으면 아래 버튼을 눌러 신청해주세요.</p>
        <button type="button" id="booth-apply-btn" class="btn btn-primary btn-block">참가 신청</button>
      </div>
    </div>

    <div class="panel" id="host-panel" style="display:none;">
      <h2>신청자 목록 <span class="form-hint">(주최측 전용)</span></h2>

      <!-- [추가] 신청자 상태 필터: 승인대기/결제대기/결제완료/환불/반려 -->
      <div class="filter-strip">
        <label class="filter-field">
          상태
          <select id="application-status-filter">
            <option value="">전체</option>
            <option value="Pending">승인대기</option>
            <option value="Approved">결제대기</option>
            <option value="Paid">결제완료</option>
            <option value="Refund">환불</option>
            <option value="Rejected">반려</option>
          </select>
        </label>
        <!-- [추가] 부스 종류(A/B/C)로 걸러 보기. 종류를 안 쓰는 마켓에서는 숨겨집니다. -->
        <label class="filter-field" hidden>
          부스 종류
          <select id="application-booth-type-filter">
            <option value="">부스 전체</option>
          </select>
        </label>
        <!-- [추가] 중복 부스 신청(같은 판매자가 이 마켓에 여러 칸)만 골라 보기 -->
        <label class="filter-field filter-check">
          <input type="checkbox" id="application-duplicate-only" />
          중복 신청만 보기
        </label>
        <span id="application-result-count" class="result-count"></span>
      </div>

      <!-- [추가] 부스 종류별 현황 + 정원 대비 신청 수 (market.js 가 채웁니다) -->
      <div id="application-booth-type-summary" class="booth-type-summary" hidden></div>

      <!-- [추가] 중복 부스 신청 요약 (market.js 가 채웁니다) -->
      <div id="application-duplicate-summary" class="dup-summary" hidden></div>

      <div id="bulk-actions-toolbar"></div>
      <div id="application-list">
        <p class="list-empty">신청 내역을 불러오는 중...</p>
      </div>
      <nav id="application-pagination" class="pagination" aria-label="신청자 목록 페이지네이션"></nav>
      <hr class="section-divider" />
      <!-- [추가] 주최자 관리 버튼. 신청자 목록을 보다가 바로 마켓을 고칠 수 있어야 합니다.
           예전에는 「내 마켓 관리」 화면으로 되돌아가야만 수정에 들어갈 수 있었습니다.
           마감·취소된 마켓에서는 market.js 가 수정/취소 버튼을 숨깁니다. -->
      <div class="host-actions">
        <button type="button" id="edit-market-btn" class="btn btn-primary btn-sm">마켓 정보 수정하기</button>
        <button type="button" id="close-market-btn" class="btn btn-outline btn-sm">이 마켓 마감 처리하기</button>
        <button type="button" id="cancel-market-btn" class="btn btn-danger btn-sm">마켓 취소하기</button>
      </div>
      <p class="form-hint" id="host-actions-hint" style="margin-top:8px;"></p>
    </div>

    <div class="panel">
      <h2>댓글 / 문의</h2>
      <div id="comment-list">
        <p class="list-empty">댓글을 불러오는 중...</p>
      </div>
      <form id="comment-form" novalidate>
        <div class="form-field">
          <input type="text" id="comment-content" class="form-input" placeholder="문의할 내용을 입력하세요" required />
        </div>
        <button type="submit" class="btn btn-primary">등록</button>
      </form>
    </div>

    <a href="../../index.html" class="back-link">← 마켓 목록으로</a>
  </div>

  <script src="../../common/js/api.js?v=4"></script>
  <script src="../../common/js/profile-link.js?v=1"></script>
  <script src="js/market.js?v=17"></script>
  <script src="js/market-detail-extra.js?v=2"></script>
  <script src="js/market-role-view.js?v=2"></script>
</body>
</html>
