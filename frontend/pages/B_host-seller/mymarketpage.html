<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>마켓 등록 - 플리마켓</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../common/css/style.css" />
    <link rel="stylesheet" href="css/host-seller.css?v=2" />
    <link rel="stylesheet" href="/common/css/search.css" />
  <!-- [C-01] 역할별 첫 화면 분기 / 주최자 전용 화면 접근 차단 -->
  <script src="../../common/js/role-routing.js?v=3"></script>
    <!-- [공통] 상단 고정 네비게이션 바 (모든 화면 공통) -->
  <link rel="stylesheet" href="../../common/css/global-nav.css?v=2" />
  <script src="../../common/js/global-nav.js?v=2" defer></script>
</head>

  <body>
    <div class="page-wrap">
      <header class="nav">
        <a href="../../index.html" class="brand"
          ><span class="pin-dot" aria-hidden="true"></span>플리마켓</a
        >
        <a href="../A_auth-main/mypage.html" class="link-ghost">마이페이지</a>
      </header>

      <div class="panel">
        <span class="pin" aria-hidden="true"></span>
        <h1>내 마켓 관리</h1>
        <p class="panel-sub">
          주최자로 등록한 마켓을 확인하고 관리할 수 있어요.
        </p>

        <div class="filter-strip">
          <label class="filter-field">
            상태
            <select id="status-filter">
              <option value="">전체</option>
              <!-- [수정] 사용자 기준 필터: 마감 전(모집중) 마켓을 기본으로 보여줌 -->
              <option value="open" selected>모집중</option>
              <option value="closed">마감</option>
              <option value="cancel">취소</option>
            </select>
          </label>

          <!-- [추가 07-28] H-02 정렬 필터 -->
          <label class="filter-field">
            정렬
            <select id="sort-filter">
              <option value="">기본 (진행중 우선)</option>
              <option value="recruitEnd">모집마감순</option>
              <option value="region">지역순</option>
              <option value="eventDate">개최순</option>
            </select>
          </label>

          <span id="result-count" class="result-count"></span>
        </div>

        <div id="alert-box" class="alert alert-error" role="alert"></div>

        <div id="market-list-container">
          <ul id="market-list" class="market-list"></ul>
          <p id="empty-state" class="empty-state" hidden>
            등록한 마켓이 없어요. 마켓을 등록해보세요.
          </p>
        </div>
        <nav id="pagination" class="pagination" aria-label="페이지네이션"></nav>
        <a href="../../index.html" class="back-link">← 마켓 목록으로</a>
      </div>
    </div>

    <script src="../../common/js/api.js?v=4"></script>
    <script src="js/marketdelete.js?v=6"></script>
    <script src="/common/js/search.js?v=3"></script>
  </body>
</html>
